<sbb-menubar
  class="main-menu"
  [model]="menuItems()"
  [ngClass]="{windowControlSpacing: electronWindowControlSpacing(), useLowProfileMenu: useLowProfileMenu() }"
>
  @if (menuStart(); as ref) {
    <div sbbMenubarStart>
      <ng-container *ngTemplateOutlet="ref"></ng-container>
    </div>
  }

  @if (menuEnd(); as ref) {
    <div sbbMenubarEnd>
      <ng-container *ngTemplateOutlet="ref"></ng-container>
    </div>
  }
</sbb-menubar>
<sbb-splitter (resizeEnd)="onResizeEnd()" class="main-splitter">
  <sbb-splitter-panel [size]="25">
    <div class="sidebar">
      <lib-sidebar/>
    </div>
  </sbb-splitter-panel>
  <sbb-splitter-panel [size]="75">
    <div class="main-content">
      <lib-page-navigator/>
      <div class="router-outlet">
        <div class="main-content-container">
          <sbb-scroll-panel>
            <router-outlet></router-outlet>
          </sbb-scroll-panel>
        </div>
      </div>
      <div class="logs">
        <button class="logs-header" (click)="toggleLogs()">
          <span class="text">Logs</span>
          @if (logsOpened()) {
            <span class="icon fa-solid fa-chevron-down"></span>
          } @else {
            <span class="icon fa-solid fa-chevron-left"></span>
          }
        </button>

        @if (logsOpened()) {
          <div class="logs-content">
            <sbb-logs-list [logs]="logs()"></sbb-logs-list>
          </div>
        }
      </div>
    </div>
  </sbb-splitter-panel>
</sbb-splitter>
