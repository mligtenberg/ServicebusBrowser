<form [formGroup]="form">
  <sbb-card class="name" header="Queue Identity">
    <sbb-float-label variant="on" label="Queue name" for="name">
      <sbb-input inputId="name" formControlName="name"></sbb-input>
    </sbb-float-label>
  </sbb-card>

  <sbb-card class="properties" header="Queue Properties" formGroupName="properties">
    <div class="line">
      <sbb-float-label variant="on" label="Max queue size in megabytes" for="maxSizeInMegabytes">
        <sbb-input-number formControlName="maxSizeInMegabytes" id="maxSizeInMegabytes"></sbb-input-number>
      </sbb-float-label>
    </div>
    <div class="line">
      <sbb-float-label variant="on" label="Max delivery count" for="maxDeliveryCount">
        <sbb-input-number formControlName="maxDeliveryCount" id="maxDeliveryCount"></sbb-input-number>
      </sbb-float-label>
    </div>
    <div class="line">
        <sbb-float-label variant="on" label="User metadata" for="userMetadata">
          <sbb-textarea
            inputId="userMetadata"
            formControlName="userMetadata"
            [rows]="5"></sbb-textarea>
      </sbb-float-label>
    </div>
    <div class="line">
      <sbb-float-label variant="on" label="Forward to" for="forwardMessagesTo">
        <sbb-tpl-endpoint-string-selector-input
          id="forwardMessagesTo"
          formControlName="forwardMessagesTo"
          [connectionsFilter]="endpointFilter()"
          />
      </sbb-float-label>
    </div>
    <div class="line">
      <sbb-float-label variant="on" label="Forward dead letters to" for="forwardDeadLetteredMessagesTo">
        <sbb-tpl-endpoint-string-selector-input
          id="forwardDeadLetteredMessagesTo"
          formControlName="forwardDeadLetteredMessagesTo"
          [connectionsFilter]="endpointFilter()"
          />
      </sbb-float-label>
    </div>
    <div class="line duration-input">
      <label for="duplicateDetectionHistoryTimeWindow">Duplicate detection time window</label>
      <sbb-duration-input id="duplicateDetectionHistoryTimeWindow" formControlName="duplicateDetectionHistoryTimeWindow"></sbb-duration-input>
    </div>
    <div class="line duration-input">
      <label for="autoDeleteOnIdle">Auto delete on idle</label>
      <sbb-duration-input id="autoDeleteOnIdle" formControlName="autoDeleteOnIdle"></sbb-duration-input>
    </div>
    <div class="line duration-input">
      <label for="defaultMessageTimeToLive">Default message time to live</label>
      <sbb-duration-input id="defaultMessageTimeToLive" formControlName="defaultMessageTimeToLive"></sbb-duration-input>
    </div>
    <div class="line duration-input">
      <label for="lockDuration">Lock duration</label>
      <sbb-duration-input id="lockDuration" formControlName="lockDuration"></sbb-duration-input>
    </div>
  </sbb-card>

  <sbb-card class="settings" header="Queue Settings" formGroupName="settings">
    <div class="checkbox">
      <sbb-checkbox formControlName="enableBatchedOperations" id="enableBatchedOperations"></sbb-checkbox>
      <!--suppress XmlInvalidId -->
      <label for="enableBatchedOperations">Enable batched operations</label>
    </div>
    <div class="checkbox">
      <sbb-checkbox formControlName="deadLetteringOnMessageExpiration" id="deadLetteringOnMessageExpiration"></sbb-checkbox>
      <!--suppress XmlInvalidId -->
      <label for="deadLetteringOnMessageExpiration">Deadlettering on message expiration</label>
    </div>
    <div class="checkbox">
      <sbb-checkbox formControlName="enablePartitioning" id="enablePartitioning"></sbb-checkbox>
      <!--suppress XmlInvalidId -->
      <label for="enablePartitioning">Partitioning</label>
    </div>
    <div class="checkbox">
      <sbb-checkbox formControlName="enableExpress" id="enableExpress"></sbb-checkbox>
      <!--suppress XmlInvalidId -->
      <label for="enableExpress">Express</label>
    </div>
    <div class="checkbox">
      <sbb-checkbox formControlName="requiresDuplicateDetection" id="requiresDuplicateDetection"></sbb-checkbox>
      <!--suppress XmlInvalidId -->
      <label for="requiresDuplicateDetection">Requires duplicate detection</label>
    </div>
    <div class="checkbox">
      <sbb-checkbox formControlName="requiresSession" id="requiresSession"></sbb-checkbox>
      <!--suppress XmlInvalidId -->
      <label for="requiresSession">Requires session</label>
    </div>
  </sbb-card>

  @if (action() === 'modify') {
    <sbb-card class="information" header="Queue Information">
      <div class="table-container">
        <sbb-data-grid
          [hideHeader]="true"
          [columns]="informationCols"
          [data]="currentQueueInformation()"
          [rowHeight]="30"
          [lazy]="false"
          [loading]="false"
        />
      </div>
    </sbb-card>
  }

  <div class="actions">
    <sbb-button (click)="save()" [disabled]="form.invalid">Save</sbb-button>
  </div>
</form>
