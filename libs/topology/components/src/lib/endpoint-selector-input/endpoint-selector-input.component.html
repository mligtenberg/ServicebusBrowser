<sbb-input-group>
  <sbb-input
    [readonly]="true"
    [ngModel]="$safeNavigationMigration(value()?.endpointDisplay)"
    (click)="dialogVisible.set(true)"
  />
  <sbb-input-group-addon>
    <sbb-button
      [icon]="clearIcon"
      [iconOnly]="true"
      aria-label="clear selection"
      severity="danger"
      variant="text"
      [disabled]="value() === null || disabled()"
      (click)="value.set(null)"
    ></sbb-button>
  </sbb-input-group-addon>
  <sbb-input-group-addon>
    <sbb-button
      [icon]="searchIcon"
      [iconOnly]="true"
      aria-label="select endpoint"
      variant="text"
      [disabled]="disabled()"
      (click)="dialogVisible.set(true)"
    ></sbb-button>
  </sbb-input-group-addon>
</sbb-input-group>

<sbb-dialog header="Select endpoint" [(open)]="dialogVisible" [modal]="true">
  <sbb-scroll-panel>
    <sbb-tpl-endpoint-selector-tree-input
      [(ngModel)]="value"
      (ngModelChange)="dialogVisible.set(false)"
      [connectionsFilter]="connectionsFilter()"
    />
  </sbb-scroll-panel>
</sbb-dialog>
