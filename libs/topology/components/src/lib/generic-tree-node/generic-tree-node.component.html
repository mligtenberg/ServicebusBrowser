@if (showContextMenu()) {
  <sbb-context-menu [model]="contextMenuItems()" [data]="node()">
    <ng-container [ngTemplateOutlet]="row" />
  </sbb-context-menu>
} @else {
  <ng-container [ngTemplateOutlet]="row" />
}

<ng-template #row>
  <div class="line-container">
    <span class="name" [sbbTooltip]="node().name" sbbTooltipPlacement="bottom">
      @if (node().icon; as icon) {
        <fa-icon [icon]="icon"></fa-icon>
      }
      @for (part of highlightParts(); track $index) {
        @if (part.highlight) {
          <mark class="search-highlight">{{ part.text }}</mark>
        } @else {
          {{ part.text }}
        }
      }
    </span>
    @if (showMessageCounts()) {
      <span [sbbTooltip]="messageCountTooltip()">{{ messageCountSummary() }}</span>
    }

    @if (showRefresh()) {
      <div class="refresh-button">
        <sbb-button
          [severity]="hasError() ? 'danger' : 'primary'"
          variant="text"
          size="small"
          [rounded]="true"
          [icon]="faRotateRight"
          [iconOnly]="true"
          [loading]="isLoading()"
          [disabled]="selectionMode() === 'none'"
          (click)="refresh($event)"
        />
      </div>
    }
  </div>
</ng-template>
