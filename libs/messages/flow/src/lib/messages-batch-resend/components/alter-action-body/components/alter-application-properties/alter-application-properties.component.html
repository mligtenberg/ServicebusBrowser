<div class="alter-application-properties-container">
  <sbb-input-group>
    <sbb-autocomplete
      required
      [(ngModel)]="fieldName"
      [suggestions]="filteredLabels()"
      (completeChange)="filterLabels($event)"
      placeholder="Property Key"
      [forceSelection]="false"
    />

    <sbb-select
      [options]="alterTypes()"
      [(ngModel)]="alterType"
      placeholder="Alter Type"
    />
  </sbb-input-group>

  @if (alterType() !== 'fullReplace') {
    <sbb-input
      required
      [(ngModel)]="searchValue"
      placeholder="Search value"
      [sbbTooltip]="alterType() === 'regexReplace' ? regexHelpText : undefined"
      sbbTooltipPlacement="top"
    />
  }

  <sbb-input-group>
    <sbb-select
      [(ngModel)]="propertyType"
      [options]="typeOptions"
    />

    @if (propertyType() === 'string') {
      <sbb-input
        required
        [(ngModel)]="value"
        [sbbTooltip]="alterType() === 'regexReplace' ? regexHelpText : undefined"
        sbbTooltipPlacement="top"
        placeholder="Value"/>
    }
    @if (propertyType() === 'datetime') {
      <sbb-date-picker
        [required]="true"
        [showTime]="true"
        [(ngModel)]="value"
        placeholder="Value"/>
    }
    @if (propertyType() === 'number') {
      <sbb-input-number required [(ngModel)]="value" placeholder="Value"/>
    }
    @if (propertyType() === 'boolean') {
      <sbb-select
        required
        [(ngModel)]="value"
        [options]="[{ label: 'True', value: true }, { label: 'False', value: false }]"/>
    }
  </sbb-input-group>
</div>
