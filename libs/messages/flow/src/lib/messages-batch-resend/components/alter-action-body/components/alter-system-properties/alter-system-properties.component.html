<div class="alter-system-properties-container">
  <sbb-input-group>
    <sbb-select
      required
      [(ngModel)]="fieldName"
      [options]="propertyKeys"
      placeholder="Select property"
    />

    <sbb-select
      [options]="alterTypes()"
      [(ngModel)]="alterType"
      placeholder="Alter Type"
    />
  </sbb-input-group>

  @if (alterType() !== 'fullReplace') {
    <sbb-input
      required
      [(ngModel)]="searchValue"
      placeholder="Search value"
      [sbbTooltip]="alterType() === 'regexReplace' ? regexHelpText : undefined"
      sbbTooltipPlacement="top"
    />
  }

  @if (propertyIsText(fieldName())) {
    <sbb-input
      required
      [(ngModel)]="value"
      placeholder="Value"
      [sbbTooltip]="alterType() === 'regexReplace' ? regexHelpText : undefined"
      sbbTooltipPlacement="top"
    />
  }
  @if (propertyIsDate(fieldName())) {
    <sbb-date-picker
      [(ngModel)]="value"
      [required]="true"
      [showTime]="true"
      placeholder="Value"
    />
  }
  @if (propertyIsTimeSpan(fieldName())) {
    <sbb-input
      (click)="togglePopover(popover, $event)"
      required
      [readonly]="true"
      [ngModel]="value()"
      class="time-span-trigger"
      aria-disabled="false"
      placeholder="Value"
    />
    <sbb-popover #popover>
      <sbb-duration-input required [(ngModel)]="value" />
    </sbb-popover>
  }

  @if (propertyIsNumber(fieldName())) {
    <sbb-input-number required [(ngModel)]="value" placeholder="Value" />
  }

  @if (propertyUnknownType(fieldName())) {
    <sbb-input required [(ngModel)]="value" placeholder="Value" />
  }
</div>
