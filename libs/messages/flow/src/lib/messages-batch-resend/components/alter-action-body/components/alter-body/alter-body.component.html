<div class="alter-body-container">
  <sbb-select
    [options]="alterTypes"
    [(ngModel)]="alterType"
    placeholder="Alter Type"
  />

  @if (alterType() !== 'fullReplace') {
    <sbb-input
      required
      [(ngModel)]="searchValue"
      placeholder="Search text"
      [sbbTooltip]="alterType() === 'regexReplace' ? regexHelpText : undefined"
      sbbTooltipPlacement="top"
    />
  }

  <div class="value-container">
    <sbb-input-group>
    <sbb-textarea
      [(ngModel)]="value"
      [rows]="5"
      placeholder="New value"
      required
      [sbbTooltip]="alterType() === 'regexReplace' ? regexHelpText : undefined"
      sbbTooltipPlacement="top"
    ></sbb-textarea>

    @if (alterType() === 'fullReplace') {
      <sbb-button
        [icon]="externalLinkIcon"
        [iconOnly]="true"
        variant="text"
        class="editor-button"
        [sbbTooltip]="'Open full screen editor'"
        sbbTooltipPlacement="top"
        aria-label="Open full screen editor"
        (click)="monacoDialogVisible.set(true)"
      ></sbb-button>
    }
    </sbb-input-group>
  </div>
</div>

<sbb-dialog
  header="Edit Body Content"
  [(open)]="monacoDialogVisible"
  [modal]="true"
  width="90vw"
  height="90vh">
  <div class="monaco-editor-container">
    <sbb-editor
    [style]="{height: '100%'}"
      [editorOptions]="editorOptions()"
      [(value)]="value"
    ></sbb-editor>
  </div>
  <div sbbDialogFooter>
    <sbb-button [icon]="checkIcon" (click)="monacoDialogVisible.set(false)">Done</sbb-button>
  </div>
</sbb-dialog>
