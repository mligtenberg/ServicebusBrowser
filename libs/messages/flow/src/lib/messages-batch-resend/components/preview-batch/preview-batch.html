<lib-messages-viewer
  [pageId]="pageId()"
  [messages]="messages()"
  [lazy]="true"
  (lazyLoadTriggered)="loadMessages($event)"
  (selectionChange)="selectionChanged($event)"
  [propertiesContextMenu]="propertiesContextMenu()"
  [applicationPropertiesContextMenu]="applicationPropertiesContextMenu()"
  [headersContextMenu]="headersContextMenu()"
  [deliveryAnnotationsContextMenu]="deliveryAnnotationsContextMenu()"
  [messageAnnotationsContextMenu]="messageAnnotationsContextMenu()"
  [bodyContextActions]="bodyContextActions()"
  [bodyModificationActions]="batchModificationActions() ?? []"
  [sendMode]="true"
  [(propertiesContextMenuSelection)]="propertiesContextMenuSelection"
  [(applicationPropertiesContextMenuSelection)]="applicationPropertiesContextMenuSelection"
  [(headersContextMenuSelection)]="headersContextMenuSelection"
  [(deliveryAnnotationsContextMenuSelection)]="deliveryAnnotationsContextMenuSelection"
  [(messageAnnotationsContextMenuSelection)]="messageAnnotationsContextMenuSelection"
/>
