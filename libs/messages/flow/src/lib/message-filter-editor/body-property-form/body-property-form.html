<sbb-input-group>
  <sbb-input-group-addon>
    <sbb-checkbox
      [formField]="bodyForm.isActive"
      class="isActive"
    />
  </sbb-input-group-addon>

  <lib-select-signal-form-input
    [options]="bodyFilterTypes"
    [formField]="bodyForm.filterType"
    optionLabel="label"
    optionValue="value"
    placeholder="Filter Type"
    class="filterType"
  />

  <sbb-input
    [formField]="asStringValueTree(bodyForm.value)"
    placeholder="Value"
    class="value"
  />

  @if (removable()) {
    <sbb-button
      [icon]="removeIcon"
      [iconOnly]="true"
      severity="danger"
      variant="text"
      aria-label="Remove"
      (click)="removeBody()"
    ></sbb-button>
  }
</sbb-input-group>
