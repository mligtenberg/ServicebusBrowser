<div class="editor-container">
  <div class="actions">
    <h2 class="title">{{header()}}</h2>
    @if (isCsvTableVisible()) {
    <div class="csv-delimiter-selector">
      <p-floatlabel variant="on">
        <p-select
          inputId="csv-delimiter"
          [(ngModel)]="csvDelimiter"
          [options]="csvDelimiterOptions"
          optionLabel="label"
          optionValue="value"
          [editable]="true"
          appendTo="body"
        />
        <label for="csv-delimiter">Delimiter</label>
      </p-floatlabel>
    </div>
    }
    <p-toggle-switch
      [(ngModel)]="showPrettyBody"
      pTooltip="Show pretty body"
      tooltipPosition="bottom"
      [disabled]="!prettyPrintAvailable()"
    />
    @if (canOpenInPopup()) {
    <p-button
      icon="pi pi-window-maximize"
      pTooltip="Open in new window"
      tooltipPosition="bottom"
      (click)="openInPopup()"
      [disabled]="!messageKey()"
      [rounded]="true"
      [text]="true"
    ></p-button>
    }
  </div>
  <div class="editor">
    <ng-container *ngTemplateOutlet="bodyView" />
  </div>
</div>

<ng-template #bodyView>
  @if (isCsvTableVisible()) {
  <div class="csv-table-wrapper">
    <p-table [value]="csvRows()" [scrollable]="true" scrollHeight="flex">
      <ng-template pTemplate="header">
        <tr>
          @for (header of csvHeaders(); track header) {
          <th>{{ header }}</th>
          }
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-rowData>
        <tr>
          @for (header of csvHeaders(); track header) {
          <td>{{ rowData[header] }}</td>
          }
        </tr>
      </ng-template>
    </p-table>
  </div>
  } @else { @let body = shownBody(); @if (body !== undefined) {
  <sbb-editor [editorOptions]="editorOptions()" [value]="body"></sbb-editor>
  } }
</ng-template>
