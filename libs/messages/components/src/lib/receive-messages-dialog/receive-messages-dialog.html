<sbb-dialog
  [modal]="true"
  [open]="loadMessagesDialogVisible()"
  [closable]="false"
  [header]="'Load ' + receiveEndpoint()?.displayName + ' messages'"
>
  <div class="load-form">
    <ng-template [ngTemplateOutlet]="optionsTemplate" [ngTemplateOutletContext]="{ $implicit: defaultOptionModel() }"></ng-template>
    <sbb-select-button [options]="receiveModes()" [ngModel]="options().receiveMode" (ngModelChange)="updateOptions('receiveMode', $event)"/>
    <ng-template [ngTemplateOutlet]="optionsTemplate" [ngTemplateOutletContext]="{ $implicit: modeOptionModel() }"></ng-template>
  </div>

  <div sbbDialogFooter>
    <sbb-button variant="text" (click)="cancelLoadMessages()" class="cancel-button">Cancel</sbb-button>
    <sbb-button (click)="loadMessages()" class="load-button">Load</sbb-button>
  </div>
</sbb-dialog>

<ng-template #optionsTemplate let-optionsModel>
  @for (option of optionsModel; track option.fieldName) {
    <div class="option">
      @if (option.description.type === 'number') {
        <ng-container *ngTemplateOutlet="numberTemplate; context: { $implicit: option }"></ng-container>
      }
      @if (option.description.type === 'string') {
        <ng-container *ngTemplateOutlet="textTemplate; context: { $implicit: option }"></ng-container>
      }
      @if (option.description.type === 'enum') {
        <sbb-select [options]="enumSelectOptions(option.description.enum)" [ngModel]="options()[option.fieldName]"
                  (ngModelChange)="updateOptions(option.fieldName, $event)"></sbb-select>
      }
      @if (option.description.type === 'notification') {
        <sbb-message severity="warn"><span class="original-line-breaks">{{ option.description.message }}</span></sbb-message>
      }
    </div>
  }
</ng-template>

<ng-template #textTemplate let-option>
  <sbb-float-label [label]="option.description.label" [for]="option.fieldName">
    <sbb-input
      type="text"
      [inputId]="option.fieldName"
      [ngModel]="options()[option.fieldName] ?? ''"
      (ngModelChange)="updateOptions(option.fieldName, $event)" />
  </sbb-float-label>
</ng-template>

<ng-template #numberTemplate let-option>
  <sbb-float-label [label]="option.description.label" [for]="option.fieldName">
    <sbb-input-number
      [inputId]="option.fieldName"
      [ngModel]="toNumberValue(options()[option.fieldName])"
      (ngModelChange)="updateOptions(option.fieldName, $event ?? undefined)" />
  </sbb-float-label>
</ng-template>
