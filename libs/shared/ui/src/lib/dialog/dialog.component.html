<ng-template #dialogTemplate>
  <div class="sbb-dialog" [style.width]="width()" [style.height]="height()">
    @if (header() || closable()) {
      <div class="sbb-dialog__header">
        <h2 class="sbb-dialog__title">{{ header() }}</h2>
        @if (closable()) {
          <button
            type="button"
            class="sbb-dialog__close"
            aria-label="Close dialog"
            (click)="requestClose()"
          >
            <span aria-hidden="true" style="pointer-events: none;">&times;</span>
          </button>
        }
      </div>
    }
    <div class="sbb-dialog__body">
      <ng-content></ng-content>
    </div>
    <div class="sbb-dialog__footer">
      <ng-content select="[sbbDialogFooter]"></ng-content>
    </div>
  </div>
</ng-template>
