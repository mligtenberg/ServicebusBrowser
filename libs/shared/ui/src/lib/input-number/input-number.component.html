<input
  class="sbb-input-number__field"
  type="number"
  [id]="inputId()"
  [min]="min() ?? null"
  [max]="max() ?? null"
  [step]="step()"
  [placeholder]="placeholder() ?? ''"
  [disabled]="disabledState()"
  [value]="value() ?? ''"
  (input)="onInput($any($event.target).value)"
  (blur)="onBlur()"
/>
