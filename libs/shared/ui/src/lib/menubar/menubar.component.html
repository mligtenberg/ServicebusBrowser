<div class="sbb-menubar-row">
  <ng-content select="[sbbMenubarStart]"></ng-content>

  <div cdkMenuBar class="sbb-menubar">
    @for (item of model(); track $index) {
      @if (!isSeparator(item)) {
        @if (item.items && item.items.length) {
          <button
            type="button"
            cdkMenuItem
            [cdkMenuTriggerFor]="submenu"
            [cdkMenuTriggerData]="{ $implicit: item.items }"
            [cdkMenuItemDisabled]="item.disabled ?? false"
            class="sbb-menubar__item"
          >
            @if (item.icon) {
              <i class="sbb-menubar__icon" [class]="item.icon"></i>
            }
            <span class="sbb-menubar__label">{{ item.label }}</span>
          </button>
        } @else {
          <button
            type="button"
            cdkMenuItem
            [cdkMenuItemDisabled]="item.disabled ?? false"
            (cdkMenuItemTriggered)="invoke(item)"
            class="sbb-menubar__item"
          >
            @if (item.icon) {
              <i class="sbb-menubar__icon" [class]="item.icon"></i>
            }
            <span class="sbb-menubar__label">{{ item.label }}</span>
          </button>
        }
      }
    }
  </div>

  <ng-content select="[sbbMenubarEnd]"></ng-content>
</div>

<ng-template #submenu let-items>
  <div cdkMenu class="sbb-menu-panel">
    @for (item of items; track $index) {
      @if (isSeparator(item)) {
        <hr class="sbb-menu-panel__separator" aria-hidden="true" />
      } @else if (item.items && item.items.length) {
        <button
          type="button"
          cdkMenuItem
          [cdkMenuTriggerFor]="submenu"
          [cdkMenuTriggerData]="{ $implicit: item.items }"
          [cdkMenuItemDisabled]="item.disabled ?? false"
          class="sbb-menu-panel__item"
        >
          @if (item.icon) {
            <i class="sbb-menu-panel__icon" [class]="item.icon"></i>
          }
          <span class="sbb-menu-panel__label">{{ item.label }}</span>
          <span class="sbb-menu-panel__caret" aria-hidden="true">›</span>
        </button>
      } @else {
        <button
          type="button"
          cdkMenuItem
          [cdkMenuItemDisabled]="item.disabled ?? false"
          (cdkMenuItemTriggered)="invoke(item)"
          class="sbb-menu-panel__item"
        >
          @if (item.icon) {
            <i class="sbb-menu-panel__icon" [class]="item.icon"></i>
          }
          <span class="sbb-menu-panel__label">{{ item.label }}</span>
        </button>
      }
    }
  </div>
</ng-template>
