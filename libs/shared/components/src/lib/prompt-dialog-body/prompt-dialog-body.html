@if (message()) {
  <div class="message">
    <p>{{ message() }}</p>
  </div>
}
<div class="input">
  <sbb-input
    #input
    type="text"
    [(ngModel)]="value"
    (keyup.enter)="confirm()" />
</div>
<div class="buttons">
  <sbb-button
    severity="secondary"
    (click)="cancel()">{{ cancelLabel() }}</sbb-button>
  <sbb-button
    [disabled]="!value().trim()"
    (click)="confirm()">{{ okLabel() }}</sbb-button>
</div>
