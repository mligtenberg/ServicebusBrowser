<form [formGroup]="form" [id]="inputId()">
  <sbb-input-group>
    @if (!disableYears()) {
      <sbb-float-label variant="on" label="Years" for="years">
        <sbb-input-number id="years" formControlName="years"></sbb-input-number>
      </sbb-float-label>
    }
    @if (!disableMonths()) {
      <sbb-float-label variant="on" label="Months" for="months">
        <sbb-input-number id="months" formControlName="months"></sbb-input-number>
      </sbb-float-label>
    }
    @if (!disableDays()) {
      <sbb-float-label variant="on" label="Days" for="days">
        <sbb-input-number id="days" formControlName="days"></sbb-input-number>
      </sbb-float-label>
    }
    @if (!disableHours()) {
      <sbb-float-label variant="on" label="Hours" for="hours">
        <sbb-input-number id="hours" formControlName="hours"></sbb-input-number>
      </sbb-float-label>
    }
    @if (!disableMinutes()) {
      <sbb-float-label variant="on" label="Minutes" for="minutes">
        <sbb-input-number id="minutes" formControlName="minutes"></sbb-input-number>
      </sbb-float-label>
    }
    @if (!disableSeconds()) {
      <sbb-float-label variant="on" label="Seconds" for="seconds">
        <sbb-input-number id="seconds" formControlName="seconds"></sbb-input-number>
      </sbb-float-label>
    }
  </sbb-input-group>
</form>
