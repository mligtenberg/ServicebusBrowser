<section class="connection-type">
  <span class="heading">Connection type</span>
  <sbb-select-button [options]="connectionTypes" [(ngModel)]="connectionType" />
</section>

@if (connectionType() === 'connectionString') {
  <section class="connection-string">
    <div class="input-field">
      <sbb-float-label label="Connection String" for="connectionString">
        <sbb-input
          inputId="connectionString"
          class="full-width"
          [(ngModel)]="connectionString"
        />
      </sbb-float-label>
    </div>
  </section>
}

@if (connectionType() === 'azureAD') {
  <section class="azure-ad">
    <div class="input-field">
      <sbb-float-label
        label="Fully Qualified Namespace"
        for="fullyQualifiedNamespace"
      >
        <sbb-input
          inputId="fullyQualifiedNamespace"
          class="full-width"
          [(ngModel)]="fullyQualifiedNamespace"
        />
      </sbb-float-label>
    </div>

    <div class="input-field">
      <span class="heading">Authentication method</span>
      <sbb-select
        inputId="authMethod"
        class="full-width"
        [options]="authMethods"
        placeholder="Select authentication method"
        [(ngModel)]="authMethod"
      />
    </div>

    @if (authMethod() === 'ServicePrincipalClientSecret') {
      <div class="input-field">
        <sbb-float-label label="Client ID" for="clientId">
          <sbb-input
            inputId="clientId"
            class="full-width"
            [(ngModel)]="clientId"
          />
        </sbb-float-label>
      </div>
      <div class="input-field">
        <sbb-float-label label="Client Secret" for="clientSecret">
          <sbb-input
            inputId="clientSecret"
            class="full-width"
            [(ngModel)]="clientSecret"
          />
        </sbb-float-label>
      </div>
      <div class="input-field">
        <sbb-float-label label="Tenant ID" for="tenantId">
          <sbb-input
            inputId="tenantId"
            class="full-width"
            [(ngModel)]="tenantId"
          />
        </sbb-float-label>
      </div>
      <div class="input-field">
        <sbb-float-label label="Authority" for="authority">
          <sbb-input
            inputId="authority"
            class="full-width"
            [(ngModel)]="authority"
          />
        </sbb-float-label>
      </div>
    }

    @if (authMethod() === 'userAssignedManagedIdentity') {
      <div class="input-field">
        <sbb-float-label label="Client ID" for="clientId">
          <sbb-input
            inputId="clientId"
            class="full-width"
            [(ngModel)]="clientId"
          />
        </sbb-float-label>
      </div>
    }

    @if (authMethod() === 'integratedAuth') {
      <div class="input-field">
        <sbb-float-label label="Email" for="email">
          <sbb-input
            inputId="email"
            type="email"
            class="full-width"
            [(ngModel)]="email"
          />
        </sbb-float-label>
      </div>
      <div class="input-field">
        <sbb-float-label
          label="Tenant ID (required for guest accounts)"
          for="integratedTenantId"
        >
          <sbb-input
            inputId="integratedTenantId"
            class="full-width"
            [(ngModel)]="integratedTenantId"
          />
        </sbb-float-label>
      </div>
    }
  </section>
}
