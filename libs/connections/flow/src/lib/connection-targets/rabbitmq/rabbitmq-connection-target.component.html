<section class="rabbitmq">
  <div class="input-field">
    <sbb-float-label label="Host" for="rabbitMqHost">
      <sbb-input inputId="rabbitMqHost" class="full-width" [(ngModel)]="host" />
    </sbb-float-label>
  </div>
  <div class="input-field">
    <sbb-float-label label="Management port" for="rabbitMqManagementPort">
      <sbb-input-number
        inputId="rabbitMqManagementPort"
        class="full-width"
        [(ngModel)]="managementPort"
      />
    </sbb-float-label>
  </div>
  <div class="input-field">
    <sbb-float-label label="AMQP port" for="rabbitMqAmqpPort">
      <sbb-input-number
        inputId="rabbitMqAmqpPort"
        class="full-width"
        [(ngModel)]="amqpPort"
      />
    </sbb-float-label>
  </div>
  <div class="input-field">
    <sbb-float-label label="VHost" for="rabbitMqVHost">
      <sbb-input inputId="rabbitMqVHost" class="full-width" [(ngModel)]="vhost" />
    </sbb-float-label>
  </div>
  <div class="input-field">
    <sbb-float-label label="Username" for="rabbitMqUserName">
      <sbb-input
        inputId="rabbitMqUserName"
        class="full-width"
        [(ngModel)]="userName"
      />
    </sbb-float-label>
  </div>
  <div class="input-field">
    <sbb-float-label label="Password" for="rabbitMqPassword">
      <sbb-input
        inputId="rabbitMqPassword"
        type="password"
        class="full-width"
        [(ngModel)]="password"
      />
    </sbb-float-label>
  </div>
</section>
