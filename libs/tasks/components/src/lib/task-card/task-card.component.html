<div class="task-card">
  <div class="task-card-content">
    <div class="description">{{ task().description }}</div>
    @if (task().statusDescription) {
      <div class="status">{{ task().statusDescription }}</div>
    }
    @if (task().hasProgress) {
      <sbb-progress-bar [value]="task().progress ?? 0" />
    } @else {
      @if (task().status === 'completed') {
        <sbb-progress-bar [value]="100" />
      } @else {
        <sbb-progress-bar [indeterminate]="true" />
      }
    }
  </div>
  @if (task().cancelable) {
    <sbb-button
      [icon]="cancelIcon"
      [iconOnly]="true"
      severity="danger"
      variant="text"
      [rounded]="true"
      size="small"
      aria-label="Cancel task"
      (click)="cancelTask.emit()"
    />
  }
</div>
