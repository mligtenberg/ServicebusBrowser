<sbb-virtual-scroller class="logs-viewport" [items]="logs()" [itemSize]="24" [appendOnly]="true">
  <ng-template let-item let-i="index">
    <sbb-logs-log-line
      [logLine]="item"
      [ngClass]="{'odd': i % 2 === 1, 'darkMode': darkMode()}">
    </sbb-logs-log-line>
  </ng-template>
</sbb-virtual-scroller>
